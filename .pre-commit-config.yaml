# See https://pre-commit.com: `uvx pre-commit install` runs these before each commit;
# CI runs them on every change.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9 # keep in step with ruff in engine/uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
