[project]
name = "copytrading-engine"
version = "0.1.0"
description = "Local trading engine bundled with the CopyTrading desktop app"
license = "MIT"
authors = [{ name = "Jackson Yang" }]
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.1",
    "discord-py-self>=2.1,<3",
    "httpx2>=2.13,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[anthropic,openai]>=2.49.0,<3",
    "mcp>=2.2,<3",
    "aiohttp>=3.14,<4",
]

[project.scripts]
copytrading = "copytrading_engine.control.cli:main"
copytrading-server = "copytrading_engine.headless.cli:main"

[project.urls]
Repository = "https://github.com/YZXBiz/copytrading"
Issues = "https://github.com/YZXBiz/copytrading/issues"
Changelog = "https://github.com/YZXBiz/copytrading/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=7",
    "ruff>=0.12",
    "time-machine>=3.5.1",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config"]
consider_namespace_packages = true
xfail_strict = true
# A leaked SQLite handle or file shows up as a ResourceWarning; fail on it instead of scrolling past.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["copytrading_engine"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "SLF", "ANN", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
# Test harnesses clean up after failures of any kind, inspect private state, and
# rely on pytest fixtures rather than annotations.
"tests/**" = ["BLE001", "SLF001", "ANN"]
# Hypothesis state-machine rules accept a refusal as one allowed outcome, not a required one.
"tests/control/test_proposals.py" = ["BLE001", "SLF001", "ANN", "PT017"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.ty.environment]
# The build scripts import one another as siblings.
extra-paths = ["../app/scripts"]

[tool.ty.src]
exclude = ["**/.venv", "**/__pycache__", "**/dist", "**/local", "**/data"]
