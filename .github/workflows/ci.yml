name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov uploads with GitHub OIDC, so the repository holds no Codecov token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      - run: make check
      - run: make coverage
      - run: uv build --directory engine
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: dist/coverage.xml
          flags: engine
          use_oidc: true
  desktop-swift:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The image's Xcode 26.6 ships Swift 6.3.3, which crashes compiling the app; 6.4 builds it.
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.4.0"
      - run: swift --version
      - run: arch -arm64 swift build --package-path app -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - run: arch -arm64 swift test --package-path app -Xswiftc -warnings-as-errors
