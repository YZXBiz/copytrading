name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every Monday: a rare flaky test shows up in a run nobody pushed.
    - cron: "0 7 * * 1"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Skips the Swift build on pull requests that change no code, as FastAPI's Test workflow does.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            desktop:
              - .github/workflows/ci.yml
              - .swift-format
              - .swift-version
              - Makefile
              - app/**
              - engine/**
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      - run: uvx pre-commit run --all-files --show-diff-on-failure
  engine:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      - run: make check
      - name: Store coverage HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: dist/coverage
          include-hidden-files: true
      - run: uv build --directory engine
  desktop-swift:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The image's Xcode 26.6 ships Swift 6.3.3, which crashes compiling the app; 6.4 builds it.
      - uses: swift-actions/setup-swift@7e293214cba9e9225c93ce3267f17f6efdb656a8 # main 2025-11-30 (swiftly); v2.4.0 predates Swift 6.4
        with:
          swift-version: "6.4.0"
      - run: swift --version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      - name: Install Python 3.14 for Apple silicon
        run: |
          uv python install 3.14 --managed-python
          printf 'UV_PYTHON=%s\n' "$(uv python find cpython-3.14-macos-aarch64-none)" >> "$GITHUB_ENV"
      - name: Prepare the pinned runtime
        run: '"$UV_PYTHON" app/scripts/prepare_runtime.py --output dist/desktop-runtime/prepared'
      # Builds the app, then runs the strict Swift build, every Swift suite (swift test) against
      # the built bundle, and the bundle verification.
      - run: make lint-swift desktop-tests
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      # Audits the workflows for security problems, as FastAPI's CI does.
      - run: uvx zizmor==1.30.1 --offline --min-severity=low .github/workflows
