name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run on pull requests that change how a release is built: everything except publishing.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .swift-version
      - Makefile
      - CHANGELOG.md
      - app/Package.swift
      - app/Resources/DMG/**
      - app/scripts/build_app.py
      - app/scripts/build_dmg.py
      - app/scripts/prepare_runtime.py
      - app/scripts/release.py
      - app/scripts/release_notes.py
      - app/scripts/smoke_app.py
      - app/scripts/verify_bundle.py

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A dry run builds the newest CHANGELOG version, so its notes are checked too.
      - name: Read the version from the tag
        id: metadata
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            # The newest versioned section; an "## Unreleased" section above it is skipped.
            tag="v$(sed -n 's/^## \([0-9][^ ]*\).*/\1/p' CHANGELOG.md | head -n 1)"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            echo "Tag $tag is not a developer-preview version such as v0.1.0-alpha.1." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a tagged commit on main and an unused release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$RELEASE_TAG does not point at a commit on main." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
      # The image's Xcode 26.6 ships Swift 6.3.3, which crashes compiling the app; 6.4 builds it.
      - uses: swift-actions/setup-swift@7e293214cba9e9225c93ce3267f17f6efdb656a8 # main 2025-11-30 (swiftly); v2.4.0 predates Swift 6.4
        with:
          swift-version: "6.4.0"

      - name: Install Python 3.14 for Apple silicon
        run: |
          set -euo pipefail
          uv python install 3.14 --managed-python
          python_path="$(uv python find cpython-3.14-macos-aarch64-none)"
          "$python_path" -c 'import platform, sys; assert sys.version_info[:2] == (3, 14); assert platform.machine() == "arm64"'
          printf 'UV_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"

      - name: Prepare the pinned runtime
        run: '"$UV_PYTHON" app/scripts/prepare_runtime.py --output dist/desktop-runtime/prepared'

      - name: Build and verify the release assets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          "$UV_PYTHON" app/scripts/release.py \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_COMMIT" \
            --runtime dist/desktop-runtime/prepared \
            --output dist/release-assets
          make dmg RELEASE_VERSION="$RELEASE_VERSION" RELEASE_OUTPUT=dist/release-assets
          "$UV_PYTHON" app/scripts/release_notes.py --version "$RELEASE_VERSION" --output dist/release-notes.md

      - name: Smoke test the released app
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/release-smoke"
          mkdir -p "$smoke_root"
          ditto -x -k "dist/release-assets/CopyTrading-v${RELEASE_VERSION}-macos-arm64.zip" "$smoke_root"
          "$UV_PYTHON" app/scripts/smoke_app.py --app "$smoke_root/CopyTrading.app"

      - name: Verify the asset set, checksums, and provenance
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          "$UV_PYTHON" - <<'PY'
          import json
          import os
          import pathlib
          import sys

          directory = pathlib.Path("dist/release-assets")
          version = os.environ["RELEASE_VERSION"]
          image = {f"CopyTrading-{version}.dmg", f"CopyTrading-{version}.dmg.sha256"}
          manifested = {
              f"CopyTrading-v{version}-macos-arm64.zip",
              f"copytrading-source-v{version}.tar.gz",
              "sbom.cyclonedx.json",
              "THIRD_PARTY_NOTICES.md",
              "THIRD_PARTY_LICENSES.zip",
          }
          expected = manifested | image | {"release-manifest.json", "SHA256SUMS"}
          actual = {entry.name for entry in directory.iterdir() if entry.is_file()}
          if actual != expected:
              sys.exit(f"unexpected release asset set: {sorted(actual)}")

          manifest = json.loads((directory / "release-manifest.json").read_text())
          release = manifest["release"]
          if release["version"] != version or release["tag"] != os.environ["RELEASE_TAG"]:
              sys.exit("release manifest version or tag does not match the tag")
          if release["prerelease"] is not True:
              sys.exit("release manifest is not a developer prerelease")
          if manifest["source"]["commit"] != os.environ["SOURCE_COMMIT"]:
              sys.exit("release manifest commit does not match the tagged commit")
          if {asset["name"] for asset in manifest["assets"]} != manifested:
              sys.exit("release manifest asset list does not match the release files")
          PY
          cd dist/release-assets
          shasum -a 256 -c SHA256SUMS
          shasum -a 256 -c "CopyTrading-${RELEASE_VERSION}.dmg.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error
          retention-days: 1
      # Sparkle (ADR-0009) installs only a download whose EdDSA signature matches the key in the
      # app, so the release signs its DMG and adds itself to the feed the app reads.
      - name: Sign the update and add it to the feed
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/Sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $tools/Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$tools/Sparkle.tar.xz" -C "$tools"
          key="$RUNNER_TEMP/sparkle-key"
          (umask 077 && printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key")
          dmg="dist/release-assets/CopyTrading-${RELEASE_VERSION}.dmg"
          signature="$("$tools/bin/sign_update" --ed-key-file "$key" "$dmg")"
          rm -f "$key"
          mkdir -p dist/feed
          curl -fsSL -o dist/feed/appcast.xml \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/appcast/appcast.xml" || rm -f dist/feed/appcast.xml
          "$UV_PYTHON" app/scripts/appcast.py \
            --feed dist/feed/appcast.xml \
            --version "$RELEASE_VERSION" \
            --build "$(git rev-list --count HEAD)" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/CopyTrading-${RELEASE_VERSION}.dmg" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --signature-line "$signature"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: update-feed
          path: dist/feed/appcast.xml
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: dist

      - name: Verify the downloaded checksums
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist/release-assets
          shasum -a 256 -c SHA256SUMS
          shasum -a 256 -c "CopyTrading-${RELEASE_VERSION}.dmg.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "CopyTrading ${RELEASE_VERSION} (developer preview)" \
            --notes-file dist/release-notes.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-feed
          path: dist/feed
      # After the release exists, so the feed never offers a download that is not there yet.
      - name: Publish the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/feed"
          git init -q "$feed"
          cp dist/feed/appcast.xml "$feed/appcast.xml"
          cd "$feed"
          git checkout -q --orphan appcast
          git add appcast.xml
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update feed for ${RELEASE_TAG}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" appcast
