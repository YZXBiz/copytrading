name: Draft developer preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version without v (for example, 0.1.0-alpha.1)
        type: string
        required: true
        default: 0.1.0-alpha.1

permissions:
  contents: read

concurrency:
  group: developer-preview-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Require main and validate version
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "Version must be a prerelease SemVer value such as 0.1.0-alpha.1." >&2
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source commit and release identity are unused
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]]; then
            echo "Checked-out source does not match the selected commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main; then
            echo "Selected source commit is not on origin/main." >&2
            exit 1
          fi

          api_status() {
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "${GITHUB_API_URL%/}/$1"
          }
          require_absent() {
            local endpoint="$1"
            local description="$2"
            local status
            status="$(api_status "$endpoint")"
            if [[ "$status" == 404 ]]; then
              return 0
            fi
            if [[ "$status" == 200 ]]; then
              echo "$description already exists; refusing to reuse it." >&2
            else
              echo "Could not verify $description absence (HTTP $status)." >&2
            fi
            return 1
          }
          require_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" "tag $RELEASE_TAG"
          require_absent "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" "release $RELEASE_TAG"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.21

      - name: Install Python 3.14 for Apple Silicon
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != arm64 ]]; then
            echo "The macos-26 runner must be Apple Silicon." >&2
            exit 1
          fi
          uv python install 3.14 --managed-python
          python_path="$(uv python find cpython-3.14-macos-aarch64-none)"
          "$python_path" -c 'import platform, sys; assert sys.version_info[:2] == (3, 14); assert platform.machine() == "arm64"'
          printf 'UV_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"

      - name: Prepare pinned runtime
        run: |
          set -euo pipefail
          "$UV_PYTHON" app/scripts/prepare_runtime.py --output dist/desktop-runtime/prepared

      - name: Run engine, packaging, and Swift checks
        run: |
          set -euo pipefail
          make desktop-check

      - name: Build and verify release assets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          "$UV_PYTHON" app/scripts/release.py \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$SOURCE_COMMIT" \
            --runtime dist/desktop-runtime/prepared \
            --output dist/release-assets

      - name: Smoke test the extracted release app
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/release-smoke"
          mkdir -p "$smoke_root"
          ditto -x -k \
            "dist/release-assets/CopyTrading-v${RELEASE_VERSION}-macos-arm64.zip" \
            "$smoke_root"
          "$UV_PYTHON" app/scripts/smoke_app.py --app "$smoke_root/CopyTrading.app"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/release-assets

      - name: Verify asset set, checksums, and provenance
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          directory = pathlib.Path("dist/release-assets")
          version = os.environ["RELEASE_VERSION"]
          expected = {
              f"CopyTrading-v{version}-macos-arm64.zip",
              f"copytrading-source-v{version}.tar.gz",
              "sbom.cyclonedx.json",
              "THIRD_PARTY_NOTICES.md",
              "THIRD_PARTY_LICENSES.zip",
              "release-manifest.json",
              "SHA256SUMS",
          }
          entries = list(directory.iterdir())
          actual = {entry.name for entry in entries if entry.is_file()}
          if actual != expected or any(not entry.is_file() for entry in entries):
              sys.exit(f"unexpected release asset set: {sorted(actual)}")

          manifest = json.loads((directory / "release-manifest.json").read_text())
          release = manifest["release"]
          if release["version"] != version or release["tag"] != os.environ["RELEASE_TAG"]:
              sys.exit("release manifest version or tag does not match the request")
          if release["type"] != "developer-preview" or release["prerelease"] is not True:
              sys.exit("release manifest is not a developer prerelease")
          if manifest["source"]["commit"] != os.environ["SOURCE_COMMIT"]:
              sys.exit("release manifest commit does not match the selected source")
          listed = {asset["name"] for asset in manifest["assets"]}
          if listed != expected - {"release-manifest.json", "SHA256SUMS"}:
              sys.exit("release manifest asset list does not match the release files")
          PY
          (cd dist/release-assets && shasum -a 256 -c SHA256SUMS)

      - name: Create the draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          api_status() {
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "${GITHUB_API_URL%/}/$1"
          }
          require_absent() {
            local endpoint="$1"
            local description="$2"
            local status
            status="$(api_status "$endpoint")"
            if [[ "$status" == 404 ]]; then
              return 0
            fi
            if [[ "$status" == 200 ]]; then
              echo "$description already exists; refusing to reuse it." >&2
            else
              echo "Could not verify $description absence (HTTP $status)." >&2
            fi
            return 1
          }
          require_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" "tag $RELEASE_TAG"
          require_absent "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" "release $RELEASE_TAG"

          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          source_commit = os.environ["SOURCE_COMMIT"]
          notes = (
              f"CopyTrading developer preview {version} for Apple Silicon and macOS 26 or later.\n\n"
              "This build is unsigned and not notarized. It is not qualified for production or live trading. "
              "Verify the assets with `shasum -a 256 -c SHA256SUMS`; the manifest identifies source commit "
              f"`{source_commit}`. License materials are provided for review and are not a legal certification.\n"
          )
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes)
          PY

          gh release create "$RELEASE_TAG" \
            "dist/release-assets/CopyTrading-v${RELEASE_VERSION}-macos-arm64.zip" \
            "dist/release-assets/copytrading-source-v${RELEASE_VERSION}.tar.gz" \
            dist/release-assets/sbom.cyclonedx.json \
            dist/release-assets/THIRD_PARTY_NOTICES.md \
            dist/release-assets/THIRD_PARTY_LICENSES.zip \
            dist/release-assets/release-manifest.json \
            dist/release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "CopyTrading $RELEASE_TAG developer preview" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            --prerelease \
            --target "$SOURCE_COMMIT"
