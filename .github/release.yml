changelog:
  exclude:
    authors:
      - github-actions[bot]
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Performance
      labels:
        - performance
    - title: Documentation
      labels:
        - documentation
    - title: Dependency updates
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
