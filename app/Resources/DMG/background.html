<!doctype html>
<html>
<head>

<style>

    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #1d1d1f;

    position: absolute; top: 172px; left: 268px; width: 124px; height: 36px;
  }
  .note {
    position: absolute; bottom: 22px; left: 40px; right: 40px; text-align: center;
    font-size: 12px; line-height: 17px; color: #5b6b66;
  }
  .note b { color: #2f3f3a; font-weight: 600; }
